<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AgentPlay 翻译设置</title>
<style>
  body { max-width: 560px; margin: 24px auto; padding: 0 16px; font: 14px/1.6 "Microsoft YaHei", system-ui, sans-serif; background: #141824; color: #dbe2f0; }
  h1 { font-size: 18px; }
  fieldset { border: 1px solid #2a3145; border-radius: 10px; margin: 14px 0; padding: 14px; }
  legend { padding: 0 6px; color: #8fa1c0; font-size: 12px; }
  label { display: block; margin: 8px 0 3px; color: #8fa1c0; font-size: 12px; }
  input, select { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 7px; border: 1px solid #2a3145; background: #0d1119; color: #dbe2f0; }
  button { padding: 9px 22px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
  #saved { color: #34d399; margin-left: 10px; font-size: 12px; }
  .hint { color: #6b7a95; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
  <h1>AgentPlay 翻译设置</h1>
  <fieldset>
    <legend>翻译引擎</legend>
    <label><input type="radio" name="engine" value="offline" style="width:auto"> 离线 OPUS-MT 英译中（免费、内容不出机，首次下载模型约 30MB 后永久离线）</label>
    <label><input type="radio" name="engine" value="cloud" style="width:auto"> 云端模型（你自己的 OpenAI 兼容 API，可翻任意语言）</label>
  </fieldset>
  <fieldset id="cloudBox">
    <legend>云端模型（OpenAI 兼容）</legend>
    <label>接口地址（Base URL）</label>
    <input id="baseUrl" placeholder="https://api.example.com/v1">
    <label>API Key（仅存本机浏览器存储）</label>
    <input id="apiKey" type="password" placeholder="sk-...">
    <label>模型</label>
    <input id="cloudModel" placeholder="如 gpt-4o-mini / agnes-2.5-flash / deepseek-chat">
    <label>目标语言</label>
    <select id="targetLang">
      <option value="中文">中文</option>
      <option value="English">English</option>
      <option value="日本語">日本語</option>
      <option value="한국어">한국어</option>
    </select>
    <div class="hint">Key 只保存在本浏览器 chrome.storage.local，不上传任何服务器；翻译时仅页面正文发往你填写的地址。</div>
  </fieldset>
  <button id="save">保存</button><span id="saved"></span>
  <script src="options.js"></script>
</body>
</html>
