<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; margin: 0; padding: 14px; font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif; background: #141824; color: #dbe2f0; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  button { width: 100%; padding: 9px 0; border: 0; border-radius: 8px; cursor: pointer; font-size: 13px; }
  #go { background: #2563eb; color: #fff; }
  #go:disabled { opacity: .45; cursor: default; }
  #undo { margin-top: 8px; background: #2a3145; color: #c7d0e2; }
  #status { margin-top: 10px; font-size: 12px; color: #8fa1c0; min-height: 18px; }
  .engine { margin-bottom: 10px; font-size: 12px; color: #8fa1c0; }
  .engine b { color: #c7d0e2; font-weight: 500; }
  a { color: #60a5fa; font-size: 12px; }
</style>
</head>
<body>
  <h1>🌐 AgentPlay 翻译</h1>
  <div class="engine" id="engineInfo">引擎：读取中…</div>
  <button id="go">翻译本页</button>
  <button id="undo" hidden>还原本页</button>
  <div id="status"></div>
  <a href="#" id="openOptions">引擎与云端模型设置</a>
  <script src="popup.js"></script>
</body>
</html>
